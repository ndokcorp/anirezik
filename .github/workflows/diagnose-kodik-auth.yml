name: One-shot owner Kodik authorization diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
        run: python scripts/research/diagnose-kodik-auth.py
