name: Bounded approved video provider diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kodik:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe exact Shikimori IDs with owner credential; no publication
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
        run: python scripts/research/probe-kodik-access.py
      - uses: actions/upload-artifact@v4
        with:
          name: approved-provider-diagnostics
          path: .cache/provider-review/kodik.json
          retention-days: 3
