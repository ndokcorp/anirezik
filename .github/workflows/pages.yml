name: Check and deploy AniRezik
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      animevost_live:
        description: Verify real AnimeVost video and controls before deploying
        type: boolean
        default: false
      liberty_probe:
        description: Isolated live diagnostics of current source without a full build
        type: boolean
        default: false
      liberty_live:
        type: boolean
        default: false
  workflow_call:
    inputs:
      liberty_live:
        type: boolean
        default: false
      liberty_artifact:
        type: string
        default: ''
      metadata_artifact:
        type: string
        default: ''
      kodik_artifact:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
env:
  ANIREZIK_EXPERIMENTAL_SHIKIMORI_POSTERS: '0'
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
  BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
jobs:
  verify:
    if: inputs.liberty_probe != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.metadata_artifact != '' && inputs.metadata_artifact != null
        with:
          name: ${{ inputs.metadata_artifact }}
          path: src/data
      - uses: actions/download-artifact@v4
        if: inputs.liberty_artifact != '' && inputs.liberty_artifact != null
        with:
          name: ${{ inputs.liberty_artifact }}
          path: src/data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: inputs.kodik_artifact != '' && inputs.kodik_artifact != null
        with:
          name: ${{ inputs.kodik_artifact }}
          path: public/data/video
      - run: node scripts/restore-kodik-cache.ts
        if: inputs.kodik_artifact != '' && inputs.kodik_artifact != null
      - name: Reject combined snapshot and video cache publication
        if: inputs.kodik_artifact != '' && inputs.metadata_artifact != '' && inputs.kodik_artifact != null && inputs.metadata_artifact != null
        run: exit 1
      - name: Validate metadata-only update
        if: inputs.metadata_artifact != '' && inputs.metadata_artifact != null
        run: node scripts/validate-snapshot.ts
      - name: Reject mixed provider publication
        if: inputs.liberty_artifact != '' && inputs.liberty_artifact != null && (inputs.metadata_artifact != '' && inputs.metadata_artifact != null || inputs.kodik_artifact != '' && inputs.kodik_artifact != null)
        run: exit 1
      - run: npm run check
      - run: npm run build
      - run: npm test -- --project=unit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-unit
          path: playwright-report/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  browsers:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: macos-15
          - browser: firefox
            os: macos-15
          - browser: webkit
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.metadata_artifact != '' && inputs.metadata_artifact != null
        with:
          name: ${{ inputs.metadata_artifact }}
          path: src/data
      - uses: actions/download-artifact@v4
        if: inputs.liberty_artifact != '' && inputs.liberty_artifact != null
        with:
          name: ${{ inputs.liberty_artifact }}
          path: src/data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages
      - name: Restore the verified static build
        run: |
          mkdir -p dist
          tar -xf .pages/artifact.tar -C dist
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test -- --project=${{ matrix.browser }}
      - name: Verify real AnimeVost video and controls before publication
        if: inputs.animevost_live == true
        env:
          ANIMEVOST_LIVE: '1'
        run: npx playwright test --config playwright.animevost.config.ts --project=${{ matrix.browser == 'webkit' && 'webkit-mobile' || matrix.browser }}
      - name: Verify isolated AnimeVost recovery and fallback
        if: inputs.animevost_live == true
        run: |
          mkdir -p .cache/animevost-053
          curl --fail --location --proto '=https' https://media.w3.org/2010/05/sintel/trailer.mp4 -o .cache/animevost-053/sintel-fixture.mp4
          npx playwright test --config playwright.animevost-recovery.config.ts --project=${{ matrix.browser == 'webkit' && 'webkit-mobile' || matrix.browser }}
      - name: Verify real AniLiberty video samples
        if: inputs.liberty_live && matrix.browser != 'firefox'
        env:
          ANILIBERTY_LIVE: '1'
        run: npm test -- --project=live-${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.liberty_live && matrix.browser != 'firefox'
        with:
          name: aniliberty-playback-${{ matrix.browser }}
          path: test-results/**/playback.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: playwright-report/
  live-probe:
    if: inputs.liberty_probe && github.ref != 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - name: Verify live samples only
        env:
          ANILIBERTY_LIVE: '1'
          ANILIBERTY_LIVE_DEV: '1'
        run: npm test -- --project=live-${{ matrix.browser }} --retries=0 --grep="real video 1 old TV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aniliberty-live-${{ matrix.browser }}
          path: |
            test-results/**/playback.json
            test-results/**/availability.json
            test-results/**/transport.json
          if-no-files-found: ignore
  publish-metadata:
    if: github.ref == 'refs/heads/main' && inputs.metadata_artifact != '' && inputs.metadata_artifact != null
    needs: [verify, browsers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reject concurrent source changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.metadata_artifact }}
          path: src/data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-snapshot.ts
      - name: Commit only validated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/catalog.json src/data/catalog-coverage.json
          if [ -f src/data/catalog-maintenance.json ]; then git add -- src/data/catalog-maintenance.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated Shikimori metadata'
            git push origin HEAD:main
          fi
  publish-kodik:
    if: github.ref == 'refs/heads/main' && inputs.kodik_artifact != '' && inputs.kodik_artifact != null
    needs: [verify, browsers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reject concurrent source changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kodik_artifact }}
          path: public/data/video
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/restore-kodik-cache.ts
      - run: node scripts/validate-kodik-cache.ts
      - name: Save only the tested provider cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data/video/kodik public/data/video/kodik-coverage.json public/data/video/kodik-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh approved Kodik cache'
            git push origin HEAD:main
          fi
  publish-liberty:
    if: github.ref == 'refs/heads/main' && inputs.liberty_artifact != '' && inputs.liberty_artifact != null
    needs: [verify, browsers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reject concurrent source changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.liberty_artifact }}
          path: src/data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-aniliberty-index.ts
      - name: Save only tested mappings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/aniliberty-index.json src/data/aniliberty-needs-review.json src/data/aniliberty-sync-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated AniLiberty catalog'
            git push origin HEAD:main
          fi
  deploy:
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.verify.result == 'success' && needs.browsers.result == 'success' &&
      (needs.publish-metadata.result == 'success' || needs.publish-metadata.result == 'skipped') &&
      (needs.publish-kodik.result == 'success' || needs.publish-kodik.result == 'skipped') &&
      (needs.publish-liberty.result == 'success' || needs.publish-liberty.result == 'skipped')
    needs: [verify, browsers, publish-metadata, publish-kodik, publish-liberty]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
