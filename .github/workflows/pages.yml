name: Check and deploy AniRezik
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      metadata_artifact:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
env:
  ANIREZIK_EXPERIMENTAL_SHIKIMORI_POSTERS: '0'
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
  BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.metadata_artifact != '' && inputs.metadata_artifact != null
        with:
          name: ${{ inputs.metadata_artifact }}
          path: src/data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate metadata-only update
        if: inputs.metadata_artifact != '' && inputs.metadata_artifact != null
        run: node scripts/validate-snapshot.ts
      - run: npm run check
      - run: npm run build
      - run: npm test -- --project=unit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-unit
          path: playwright-report/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  browsers:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: webkit
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.metadata_artifact != '' && inputs.metadata_artifact != null
        with:
          name: ${{ inputs.metadata_artifact }}
          path: src/data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages
      - name: Restore the verified static build
        run: |
          mkdir -p dist
          tar -xf .pages/artifact.tar -C dist
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: playwright-report/
  publish-metadata:
    if: inputs.metadata_artifact != '' && inputs.metadata_artifact != null
    needs: [verify, browsers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reject concurrent source changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.metadata_artifact }}
          path: src/data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-snapshot.ts
      - name: Commit only validated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/catalog.json src/data/catalog-coverage.json
          if [ -f src/data/catalog-maintenance.json ]; then git add -- src/data/catalog-maintenance.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated Shikimori metadata'
            git push origin HEAD:main
          fi
  deploy:
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.verify.result == 'success' && needs.browsers.result == 'success' &&
      (needs.publish-metadata.result == 'success' || needs.publish-metadata.result == 'skipped')
    needs: [verify, browsers, publish-metadata]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
